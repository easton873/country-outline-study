<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country Outline Study</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1c1e21; --muted:#6b7280; --line:#d8dbe0; --accent:#2563eb; --good:#15803d; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--muted); font-size:.9rem; }
  input[type=number] { width:80px; font:inherit; padding:8px; border:1px solid var(--line); border-radius:8px; }
  .outline { background:#fff; border-radius:8px; border:1px solid var(--line); padding:8px; text-align:center; }
  .outline img { width:100%; max-width:420px; aspect-ratio:1; object-fit:contain; display:block; margin:0 auto; }
  .combo { position:relative; margin-top:12px; }
  .combo input { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .combo ul { position:absolute; z-index:5; left:0; right:0; top:100%; margin:4px 0 0; padding:4px 0; list-style:none; max-height:260px; overflow-y:auto; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.15); }
  .combo li { padding:8px 12px; cursor:pointer; }
  .combo li.active, .combo li:hover { background:#e8f0fe; }
  .combo li.empty { color:var(--muted); cursor:default; }
  .result { margin-top:12px; font-weight:600; }
  .result.good { color:var(--good); } .result.bad { color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
  details summary { cursor:pointer; }
  .hidden { display:none; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1e2127; --ink:#e8eaed; --muted:#9aa0a8; --line:#363b44; --accent:#3b82f6; --good:#4ade80; --bad:#f87171; }
    button { background:#272b33; }
    .combo input, input[type=number] { background:#14161a; }
    .combo ul { background:#1e2127; } .combo li.active, .combo li:hover { background:#2b3342; }
  }
</style>
</head>
<body>
<main>
  <h1>Country Outline Study</h1>

  <section id="home" class="card">
    <div class="row">
      <label>Countries this session <input id="count" type="number" min="1" value="20"></label>
      <button id="start" class="primary">Start session</button>
      <button id="startAll">All countries</button>
    </div>
    <p class="muted">Order: fewest views first, then highest score (the ones you miss most). Ties are shuffled.</p>
    <details>
      <summary>Progress (<span id="seenCount"></span>)</summary>
      <table><thead><tr><th>Country</th><th>Views</th><th>Score</th></tr></thead><tbody id="stats"></tbody></table>
      <p><button id="reset">Reset all data</button></p>
    </details>
  </section>

  <section id="study" class="card hidden">
    <div class="row" style="justify-content:space-between">
      <span class="muted" id="progress"></span>
      <button id="finish">Finish early</button>
    </div>
    <div class="outline"><img id="img" alt="Country outline"></div>
    <div class="combo">
      <input id="answer" type="text" placeholder="Which country is this? Type or pick…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="list">
      <ul id="list" role="listbox" class="hidden"></ul>
    </div>
    <div id="result" class="result"></div>
    <p><button id="next" class="primary hidden">Next</button></p>
  </section>

  <section id="done" class="card hidden">
    <h2 id="doneTitle" style="margin-top:0">Session complete</h2>
    <p id="summary"></p>
    <button id="again" class="primary">Back to start</button>
  </section>
</main>

let queue = [], idx = 0, current = null, answered = false, right = 0, wrong = 0;

function shuffle(a) { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function show(id) { for (const s of ['home','study','done']) $(s).classList.toggle('hidden', s!==id); }

function renderStats() {
  const seen = COUNTRIES.filter(c => (stats[c.code]||{}).views).length;
  $('seenCount').textContent = `${seen}/${COUNTRIES.length} seen`;
  const rows = COUNTRIES.map(c => ({c, s: stats[c.code] || {views:0,score:0}}))
    .sort((a,b) => b.s.score - a.s.score || a.s.views - b.s.views || a.c.name.localeCompare(b.c.name));
  $('stats').innerHTML = rows.map(r => `<tr><td>${esc(r.c.name)}</td><td>${r.s.views}</td><td>${r.s.score}</td></tr>`).join('');
}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function startSession(all) {
  const n = all === true ? COUNTRIES.length : Math.max(1, Math.min(COUNTRIES.length, parseInt($('count').value) || 20));
  const items = shuffle(COUNTRIES.slice()).sort((a,b) => {
    const sa = stats[a.code]||{views:0,score:0}, sb = stats[b.code]||{views:0,score:0};
    return sa.views - sb.views || sb.score - sa.score; // fewest views, then highest score
  });
  queue = items.slice(0, n); idx = 0; right = wrong = 0;
  show('study'); nextQuestion();
}

function nextQuestion() {
  if (idx >= queue.length) return endSession(false);
  current = queue[idx]; answered = false;
  $('img').src = current.file;
  $('progress').textContent = `${idx+1} / ${queue.length}`;
  $('answer').value = ''; $('answer').disabled = false;
  $('result').textContent = ''; $('result').className = 'result';
  $('next').classList.add('hidden');
  $('answer').focus();
  renderList();
}

function submit(country) {
  if (answered) return;
  answered = true;
  const s = get(current.code);
  s.views++;
  if (country.code === current.code) { s.score = Math.max(0, s.score - 1); right++;
    $('result').textContent = '✓ Correct: ' + current.name; $('result').className = 'result good';
  } else { s.score += 5; wrong++;
    $('result').textContent = `✗ Wrong — it's ${current.name}`; $('result').className = 'result bad'; }
  save(); idx++;
  $('answer').disabled = true; closeList();
  $('next').textContent = idx >= queue.length ? 'Finish' : 'Next';
  $('next').classList.remove('hidden'); $('next').focus();
}

function endSession(early) {
  let skipped = 0;
  if (early) {
    // add a view to every country in the session not yet answered
    for (let i = idx; i < queue.length; i++) { get(queue[i].code).views++; skipped++; }
    save();
  }
  $('doneTitle').textContent = early ? 'Session finished early' : 'Session complete';
  $('summary').textContent = `Correct: ${right}, wrong: ${wrong}` + (early ? `, skipped (view added): ${skipped}` : '') + '.';
  show('done');
}

/* ---- autocomplete ---- */
let matches = [], active = -1;
function filterNames(q) {
  q = q.trim().toLowerCase();
  if (!q) return COUNTRIES.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const starts = [], contains = [];
  for (const c of COUNTRIES) {
    const n = c.name.toLowerCase(), i = n.indexOf(q);
    if (i === 0) starts.push(c); else if (i > 0) contains.push(c);
  }
  const cmp = (a,b)=>a.name.localeCompare(b.name);
  return starts.sort(cmp).concat(contains.sort(cmp));
}
function renderList() {
  const input = $('answer');
  if (answered || input.disabled) return closeList();
  matches = filterNames(input.value); active = matches.length ? 0 : -1;
  const ul = $('list');
  ul.innerHTML = matches.length
    ? matches.map((c,i)=>`<li role="option" data-i="${i}" class="${i===active?'active':''}">${esc(c.name)}</li>`).join('')
    : '<li class="empty">No matches</li>';
  ul.classList.remove('hidden'); input.setAttribute('aria-expanded','true');
  ul.scrollTop = 0;
}
function closeList() { $('list').classList.add('hidden'); $('answer').setAttribute('aria-expanded','false'); }
function setActive(i) {
  if (!matches.length) return;
  active = (i + matches.length) % matches.length;
  [...$('list').children].forEach((li,k)=>li.classList.toggle('active', k===active));
  $('list').children[active].scrollIntoView({block:'nearest'});
}

$('answer').addEventListener('input', renderList);
$('answer').addEventListener('focus', renderList);
$('answer').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); if ($('list').classList.contains('hidden')) renderList(); else setActive(active+1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active-1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (matches[active]) submit(matches[active]); }
  else if (e.key === 'Escape') closeList();
});
$('list').addEventListener('mousedown', e => {
  const li = e.target.closest('li[data-i]'); if (!li) return;
  e.preventDefault(); submit(matches[+li.dataset.i]);
});
document.addEventListener('click', e => { if (!e.target.closest('.combo')) closeList(); });

$('start').onclick = () => startSession();
$('startAll').onclick = () => startSession(true);
$('next').onclick = nextQuestion;
$('finish').onclick = () => endSession(true);
$('again').onclick = () => { renderStats(); show('home'); };
$('reset').onclick = () => { if (confirm('Erase all views and scores?')) { stats = {}; save(); renderStats(); } };
renderStats();
</script>
</body>
</html>
